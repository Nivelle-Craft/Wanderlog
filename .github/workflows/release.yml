name: Release

# Publishes the downloadable JAR in the repository Releases section.
'on':
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.1.1'

      - name: Build Wanderlog
        run: gradle --no-daemon clean build

      - name: Prepare JAR
        shell: bash
        run: |
          mapfile -t JARS < <(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar')
          if [ "${#JARS[@]}" -ne 1 ]; then
            echo "Expected exactly one release JAR; found ${#JARS[@]}." >&2
            exit 1
          fi
          cp "${JARS[0]}" Wanderlog-latest.jar

      - name: Publish Wanderlog Latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          git tag --force latest "$GITHUB_SHA"
          git push --force origin refs/tags/latest
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Wanderlog-latest.jar --clobber
            gh release edit latest --title 'Wanderlog Latest' --draft=false --prerelease=false --latest
          else
            gh release create latest Wanderlog-latest.jar \
              --title 'Wanderlog Latest' \
              --notes 'Latest successful development build of Wanderlog for Minecraft Forge 1.20.1. For stable servers, prefer a numbered release.' \
              --target "$GITHUB_SHA" \
              --latest
          fi

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          VERSIONED_JAR="Wanderlog-${TAG#v}.jar"
          cp Wanderlog-latest.jar "$VERSIONED_JAR"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VERSIONED_JAR" --clobber
          else
            gh release create "$TAG" "$VERSIONED_JAR" \
              --title "Wanderlog ${TAG#v}" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
