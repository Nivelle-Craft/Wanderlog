name: Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Make Gradle executable
        run: chmod +x gradlew

      - name: Build Wanderlog
        run: ./gradlew clean build

      - name: Prepare JAR
        shell: bash
        run: |
          JAR=$(find build/libs -maxdepth 1 -type f -name '*.jar' ! -name '*-sources.jar' ! -name '*-javadoc.jar' ! -name '*-dev.jar' | head -n 1)
          if [ -z "$JAR" ]; then
            echo 'No Wanderlog JAR produced by Gradle.' >&2
            exit 1
          fi
          cp "$JAR" Wanderlog-latest.jar

      - name: Publish Wanderlog Latest
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Wanderlog-latest.jar --clobber
          else
            gh release create latest Wanderlog-latest.jar \
              --title 'Wanderlog Latest' \
              --notes 'Latest successful development build of Wanderlog for Minecraft Forge 1.20.1. For stable servers, prefer a numbered release.' \
              --target "$GITHUB_SHA" \
              --prerelease
          fi

      - name: Publish versioned release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        shell: bash
        run: |
          VERSIONED_JAR="Wanderlog-${TAG#v}.jar"
          cp Wanderlog-latest.jar "$VERSIONED_JAR"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$VERSIONED_JAR" --clobber
          else
            gh release create "$TAG" "$VERSIONED_JAR" \
              --title "Wanderlog ${TAG#v}" \
              --generate-notes \
              --target "$GITHUB_SHA"
          fi
